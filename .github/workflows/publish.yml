name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@edfcb8fb712b91f98caf6fa0095c35797b66200a
    with:
      source: illustrations-001
      tooling-ref: edfcb8fb712b91f98caf6fa0095c35797b66200a
      check-authentication: ${{ inputs.check-authentication }}
