name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@9bfb355ec00b2236fd64915dbde26b203c8b5b13
    with:
      source: illustrations-001
      tooling-ref: 9bfb355ec00b2236fd64915dbde26b203c8b5b13
      check-authentication: ${{ inputs.check-authentication }}
